name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The gate reads the tree and nothing else.
permissions:
  contents: read

# A push supersedes the run already in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check formatting, module hygiene and generated files
        run: task verify

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both architectures of both platforms, because the support matrix in
        # docs/reference/platforms.md says the suite runs on each, and a runner
        # label is what makes that true. ubuntu-latest is amd64 and
        # macos-latest is arm64, so the other half of each needs naming.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the tests under the race detector
        run: go test -race -shuffle=on ./...

  cover:
    name: cover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # -coverpkg attributes a package's coverage to it wherever the test
      # that exercised it lives, so a package driven by the conformance corpus
      # or by the terminal harness is credited for what those actually cover.
      - name: Measure coverage
        run: go test -covermode=atomic -coverpkg=./... -coverprofile=cover.out ./...
      # The floors live in coverage.yaml and are raised by review. A run here
      # enforces them and never rewrites them, so the gate cannot lower itself.
      - name: Enforce the coverage floors
        run: go run ./internal/tools/covercheck -profile cover.out -config coverage.yaml
      - name: Keep the profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile
          path: cover.out
          if-no-files-found: error

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run every fuzz target briefly
        run: task fuzz
      # A crash is reproducible only with the input that caused it.
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Report known vulnerabilities
        run: govulncheck ./...

  # Windows is a supported build target, not an asserted one. The property
  # that agentfs never reads outside its workspace root rests on os.Root, and
  # the symlink cases proving it are exercised on the platforms above.
  windows-build:
    name: windows ${{ matrix.goarch }} (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile for windows/${{ matrix.goarch }}
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
