name: pages

# A schema's $id is a promise that resolving it returns the document. This
# workflow keeps the promise: it serves schema/ under the site the $id names,
# at the path the $id names, for the tag that shipped it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One site, one deployment. A deployment in flight is allowed to finish, so a
# second tag pushed minutes after the first does not leave the site half
# published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The destination is derived from each document's own $id rather than
      # written here, so the served path and the identifier cannot disagree. An
      # $id naming a site this workflow does not serve fails the run instead of
      # publishing a document nothing can resolve.
      - name: Stage each schema at the path its $id names
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY%%/*}
          repo=${GITHUB_REPOSITORY#*/}
          base="https://${owner}.github.io/${repo}/"
          staged=0
          for file in schema/*.json; do
            id=$(jq -r '."$id" // empty' "$file")
            if [ -z "$id" ]; then
              printf "%s declares no \$id\n" "$file" >&2
              exit 1
            fi
            case "$id" in
              "$base"?*) ;;
              *) printf "%s declares \$id %s, which is not under %s\n" "$file" "$id" "$base" >&2
                 exit 1 ;;
            esac
            dest="_site/${id#"$base"}"
            mkdir -p "$(dirname "$dest")"
            cp "$file" "$dest"
            printf 'staged %s at %s\n' "$file" "$dest"
            staged=$((staged + 1))
          done
          if [ "$staged" -eq 0 ]; then
            echo 'schema/ holds no document to publish' >&2
            exit 1
          fi
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deployment mints the OIDC token Pages authenticates with, so it holds the
    # only write permission in this workflow.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
