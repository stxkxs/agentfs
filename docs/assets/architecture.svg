<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .card { fill: #161B22; stroke: #30363D; stroke-width: 1; rx: 8; }
      .card-green { fill: #161B22; stroke: #34D399; stroke-width: 1.5; rx: 8; }
      .card-blue { fill: #161B22; stroke: #58A6FF; stroke-width: 1.5; rx: 8; }
      .card-amber { fill: #161B22; stroke: #F0B429; stroke-width: 1.5; rx: 8; }
      .band { fill: #0D1117; stroke: #21262D; stroke-width: 1; rx: 10; }
      .h1 { fill: #E6EDF3; font-size: 26px; font-weight: 700; }
      .h2 { fill: #8B949E; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; }
      .name { fill: #E6EDF3; font-size: 13px; font-weight: 600; }
      .name-green { fill: #34D399; font-size: 13px; font-weight: 600; }
      .name-blue { fill: #58A6FF; font-size: 13px; font-weight: 600; }
      .name-amber { fill: #F0B429; font-size: 13px; font-weight: 600; }
      .body { fill: #8B949E; font-size: 11px; }
      .mono { fill: #8B949E; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .mono-lit { fill: #A5D6FF; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .arrow { stroke: #484F58; stroke-width: 1.5; fill: none; marker-end: url(#head); }
      .arrow-green { stroke: #34D399; stroke-width: 1.5; fill: none; marker-end: url(#head-green); }
      .rule { stroke: #21262D; stroke-width: 1; }
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#484F58"/>
    </marker>
    <marker id="head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34D399"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="900"/>

  <text class="h1" x="40" y="46">agentfs</text>
  <text class="body" x="40" y="68">A terminal view of what your agents are doing, and the contract they declare it with.</text>

  <!-- ── Data flow ─────────────────────────────────────────────────────── -->
  <text class="h2" x="40" y="112">DATA FLOW</text>
  <line class="rule" x1="40" y1="122" x2="1160" y2="122"/>

  <rect class="card" x="40" y="140" width="220" height="104"/>
  <text class="name" x="60" y="166">agents</text>
  <text class="body" x="60" y="188">write state.json, logs,</text>
  <text class="body" x="60" y="204">memory and artifacts</text>
  <text class="mono" x="60" y="226">any language · any host</text>

  <path class="arrow" d="M268,192 L318,192"/>

  <rect class="card" x="326" y="140" width="220" height="104"/>
  <text class="name" x="346" y="166">filesystem</text>
  <text class="body" x="346" y="188">local directory, NFS, EFS,</text>
  <text class="body" x="346" y="204">SMB, or a FUSE mount</text>
  <text class="mono" x="346" y="226">the only interface</text>

  <path class="arrow-green" d="M554,192 L604,192"/>

  <rect class="card-green" x="612" y="140" width="220" height="104"/>
  <text class="name-green" x="632" y="166">agentfs</text>
  <text class="body" x="632" y="188">observe · decode · validate</text>
  <text class="body" x="632" y="204">render · report</text>
  <text class="mono" x="632" y="226">read-only, by construction</text>

  <path class="arrow" d="M840,192 L890,192"/>

  <rect class="card-blue" x="898" y="140" width="262" height="104"/>
  <text class="name-blue" x="918" y="166">a person, or another agent</text>
  <text class="body" x="918" y="188">alt-screen TUI, or JSON and</text>
  <text class="body" x="918" y="204">NDJSON with real exit codes</text>
  <text class="mono" x="918" y="226">watch · scan · validate · doctor</text>

  <!-- ── Change detection ──────────────────────────────────────────────── -->
  <text class="h2" x="40" y="298">CHANGE DETECTION — CHOSEN BY WHAT THE FILESYSTEM IS</text>
  <line class="rule" x1="40" y1="308" x2="1160" y2="308"/>

  <rect class="card-green" x="40" y="326" width="360" height="150"/>
  <text class="name-green" x="60" y="352">local filesystem</text>
  <text class="mono" x="60" y="374">apfs · ext · xfs · btrfs · zfs · tmpfs</text>
  <text class="body" x="60" y="400">Kernel notification alone.</text>
  <text class="body" x="60" y="418">Every write passes through this kernel,</text>
  <text class="body" x="60" y="436">so every write raises an event.</text>
  <text class="mono-lit" x="60" y="460">--watch=notify</text>

  <rect class="card-amber" x="420" y="326" width="360" height="150"/>
  <text class="name-amber" x="440" y="352">network export or FUSE mount</text>
  <text class="mono" x="440" y="374">nfs · efs · smb · ceph · s3 mounts</text>
  <text class="body" x="440" y="400">Notification plus a bounded stat sweep.</text>
  <text class="body" x="440" y="418">Another client's write reaches the export</text>
  <text class="body" x="440" y="436">without passing through this kernel.</text>
  <text class="mono-lit" x="440" y="460">--watch=hybrid</text>

  <rect class="card" x="800" y="326" width="360" height="150"/>
  <text class="name" x="820" y="352">what the sweep costs</text>
  <text class="body" x="820" y="378">It re-reads the directories on screen, so</text>
  <text class="body" x="820" y="396">its cost follows the viewport rather than</text>
  <text class="body" x="820" y="414">the size of the workspace.</text>
  <text class="body" x="820" y="438">A change inside a collapsed directory is</text>
  <text class="body" x="820" y="456">reported when it is opened.</text>

  <!-- ── Internal architecture ─────────────────────────────────────────── -->
  <text class="h2" x="40" y="530">INTERNAL ARCHITECTURE — DEPENDENCIES POINT INWARD</text>
  <line class="rule" x1="40" y1="540" x2="1160" y2="540"/>

  <rect class="band" x="40" y="558" width="1120" height="86"/>
  <text class="h2" x="58" y="580">SURFACE</text>
  <rect class="card-blue" x="150" y="566" width="180" height="70"/>
  <text class="name-blue" x="166" y="590">ui/app</text>
  <text class="body" x="166" y="608">the one tea.Model:</text>
  <text class="body" x="166" y="624">focus, routing, commands</text>
  <rect class="card-blue" x="346" y="566" width="180" height="70"/>
  <text class="name-blue" x="362" y="590">ui/pane</text>
  <text class="body" x="362" y="608">tree · preview · feed</text>
  <text class="body" x="362" y="624">runs · agents · status</text>
  <rect class="card-blue" x="542" y="566" width="228" height="70"/>
  <text class="name-blue" x="558" y="590">ui/render · layout · theme · keys</text>
  <text class="body" x="558" y="608">geometry, tokens, bindings,</text>
  <text class="body" x="558" y="624">and the fit-to-rect boundary</text>
  <rect class="card-blue" x="786" y="566" width="180" height="70"/>
  <text class="name-blue" x="802" y="590">cli</text>
  <text class="body" x="802" y="608">commands, flags,</text>
  <text class="body" x="802" y="624">exit codes</text>
  <rect class="card-blue" x="982" y="566" width="162" height="70"/>
  <text class="name-blue" x="998" y="590">report</text>
  <text class="body" x="998" y="608">JSON envelope,</text>
  <text class="body" x="998" y="624">NDJSON stream</text>

  <path class="arrow" d="M600,652 L600,676"/>

  <rect class="band" x="40" y="684" width="1120" height="86"/>
  <text class="h2" x="58" y="706">DOMAIN</text>
  <rect class="card-green" x="150" y="692" width="228" height="70"/>
  <text class="name-green" x="166" y="716">agentstate</text>
  <text class="body" x="166" y="734">the contract: types, vocabulary,</text>
  <text class="body" x="166" y="750">decoder, published schema</text>
  <rect class="card" x="394" y="692" width="180" height="70"/>
  <text class="name" x="410" y="716">workspace</text>
  <text class="body" x="410" y="734">agents, runs, presence,</text>
  <text class="body" x="410" y="750">the settle rule</text>
  <rect class="card" x="590" y="692" width="180" height="70"/>
  <text class="name" x="606" y="716">index</text>
  <text class="body" x="606" y="734">lazy tree, bounded</text>
  <text class="body" x="606" y="750">incremental updates</text>
  <rect class="card" x="786" y="692" width="180" height="70"/>
  <text class="name" x="802" y="716">watch</text>
  <text class="body" x="802" y="734">notify · sweep · hybrid,</text>
  <text class="body" x="802" y="750">coalescing, statistics</text>
  <rect class="card" x="982" y="692" width="162" height="70"/>
  <text class="name" x="998" y="716">fileview</text>
  <text class="body" x="998" y="734">bounded windows,</text>
  <text class="body" x="998" y="750">tailing, lexers</text>

  <path class="arrow" d="M600,778 L600,802"/>

  <rect class="band" x="40" y="810" width="1120" height="70"/>
  <text class="h2" x="58" y="832">SEAMS</text>
  <rect class="card-green" x="150" y="818" width="228" height="54"/>
  <text class="name-green" x="166" y="842">fsx</text>
  <text class="body" x="166" y="860">os.Root — confined, and no write method</text>
  <rect class="card" x="394" y="818" width="180" height="54"/>
  <text class="name" x="410" y="842">textx</text>
  <text class="body" x="410" y="860">sanitize, fit, search</text>
  <rect class="card" x="590" y="818" width="180" height="54"/>
  <text class="name" x="606" y="842">diag</text>
  <text class="body" x="606" y="860">codes, severities, positions</text>
  <rect class="card" x="786" y="818" width="180" height="54"/>
  <text class="name" x="802" y="842">config</text>
  <text class="body" x="802" y="860">every ceiling, one table</text>
  <rect class="card" x="982" y="818" width="162" height="54"/>
  <text class="name" x="998" y="842">metrics</text>
  <text class="body" x="998" y="860">budgets, counters</text>
</svg>
