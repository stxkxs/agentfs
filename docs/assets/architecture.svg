<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .card { fill: #161B22; stroke: #30363D; stroke-width: 1; rx: 8; }
      .card-hi { fill: #161B22; stroke: #34D399; stroke-width: 1.5; rx: 8; }
      .card-blue { fill: #161B22; stroke: #58A6FF; stroke-width: 1.5; rx: 8; }
      .card-orange { fill: #161B22; stroke: #FFA657; stroke-width: 1.5; rx: 8; }
      .card-purple { fill: #161B22; stroke: #D2A8FF; stroke-width: 1.5; rx: 8; }
      .title { fill: #E6EDF3; font-size: 13px; font-weight: 600; }
      .sub { fill: #8B949E; font-size: 10px; }
      .label { fill: #34D399; font-size: 9px; font-weight: 600; letter-spacing: 0.08em; }
      .label-blue { fill: #58A6FF; font-size: 9px; font-weight: 600; letter-spacing: 0.08em; }
      .label-orange { fill: #FFA657; font-size: 9px; font-weight: 600; letter-spacing: 0.08em; }
      .label-purple { fill: #D2A8FF; font-size: 9px; font-weight: 600; letter-spacing: 0.08em; }
      .heading { fill: #E6EDF3; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
      .dim { fill: #8B949E; font-size: 11px; }
      .sec { fill: #34D399; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; }
      .cmd { fill: #8B949E; font-size: 9px; }
      .dot { fill: #34D399; }
      .arrow { stroke: #30363D; stroke-width: 1.5; fill: none; }
      .arrow-hi { stroke: #34D399; stroke-width: 1.5; fill: none; }
      .mono { font-family: ui-monospace, 'SF Mono', monospace; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="580"/>

  <text class="heading" x="40" y="36">agentfs</text>
  <text class="dim" x="40" y="52">Terminal UI for watching AI agent workspaces in real time</text>

  <!-- ═══ Left: Data Flow ═══ -->
  <text class="sec" x="40" y="82">DATA FLOW</text>

  <!-- Agent sources -->
  <rect class="card-orange" x="40" y="92" width="150" height="70"/>
  <text class="label-orange" x="56" y="110">AGENTS</text>
  <text class="sub" x="56" y="126">LangChain · CrewAI</text>
  <text class="sub" x="56" y="140">AutoGen · Custom</text>
  <text class="sub" x="56" y="154">Claude · Bedrock</text>

  <!-- Arrow: agents → filesystem -->
  <line class="arrow" x1="196" y1="127" x2="232" y2="127"/>
  <polygon points="232,123 240,127 232,131" fill="#30363D"/>

  <!-- Filesystem layer -->
  <rect class="card-hi" x="244" y="92" width="168" height="70"/>
  <text class="label" x="260" y="110">FILESYSTEM</text>
  <text class="sub" x="260" y="126">S3 Files mount</text>
  <text class="sub" x="260" y="140">Local directory</text>
  <text class="sub" x="260" y="154">NFS · EFS · FUSE</text>

  <!-- Arrow: filesystem → agentfs -->
  <line class="arrow-hi" x1="418" y1="127" x2="454" y2="127"/>
  <polygon points="454,123 462,127 454,131" fill="#34D399"/>

  <!-- agentfs box -->
  <rect class="card-blue" x="466" y="92" width="130" height="70"/>
  <text class="label-blue" x="482" y="110">AGENTFS</text>
  <text class="sub" x="482" y="126">watch · detect</text>
  <text class="sub" x="482" y="140">render · search</text>
  <text class="sub" x="482" y="154">navigate · tail</text>

  <!-- Arrow: agentfs → terminal -->
  <line class="arrow" x1="602" y1="127" x2="638" y2="127"/>
  <polygon points="638,123 646,127 638,131" fill="#30363D"/>

  <!-- Terminal -->
  <rect class="card" x="650" y="92" width="130" height="70"/>
  <text class="title" x="666" y="110">Terminal</text>
  <text class="sub" x="666" y="126">Alt-screen TUI</text>
  <text class="sub" x="666" y="140">Bubble Tea</text>
  <text class="sub" x="666" y="154">Lip Gloss</text>

  <!-- ═══ Middle: Internal Architecture ═══ -->
  <text class="sec" x="40" y="198">INTERNAL ARCHITECTURE</text>

  <!-- Watcher -->
  <rect class="card-hi" x="40" y="210" width="170" height="56"/>
  <text class="title" x="56" y="230">watcher</text>
  <text class="sub" x="56" y="244">fsnotify · recursive dir watch</text>
  <text class="sub" x="56" y="258">create · modify · delete events</text>

  <!-- Arrow: watcher fans out -->
  <line class="arrow-hi" x1="216" y1="238" x2="252" y2="218"/>
  <line class="arrow-hi" x1="216" y1="238" x2="252" y2="238"/>
  <line class="arrow-hi" x1="216" y1="238" x2="252" y2="258"/>
  <line class="arrow-hi" x1="216" y1="238" x2="252" y2="298"/>

  <!-- Tree -->
  <rect class="card-blue" x="258" y="202" width="170" height="32"/>
  <text class="title" x="274" y="218">tree</text>
  <text class="sub" x="314" y="218">navigable dir tree</text>

  <!-- Activity -->
  <rect class="card-blue" x="258" y="240" width="170" height="32"/>
  <text class="title" x="274" y="256">activity</text>
  <text class="sub" x="326" y="256">live change feed</text>

  <!-- Viewer -->
  <rect class="card-blue" x="258" y="278" width="170" height="32"/>
  <text class="title" x="274" y="294">viewer</text>
  <text class="sub" x="318" y="294">file preview + search</text>

  <!-- Agent detection -->
  <rect class="card-purple" x="258" y="316" width="170" height="32"/>
  <text class="title" x="274" y="332">agent</text>
  <text class="sub" x="314" y="332">detect + status + runs</text>

  <!-- Arrows to app -->
  <line class="arrow" x1="434" y1="218" x2="470" y2="262"/>
  <line class="arrow" x1="434" y1="256" x2="470" y2="262"/>
  <line class="arrow" x1="434" y1="294" x2="470" y2="262"/>
  <line class="arrow" x1="434" y1="332" x2="470" y2="262"/>

  <!-- App model -->
  <rect class="card-hi" x="476" y="238" width="170" height="50"/>
  <text class="title" x="492" y="258">app</text>
  <text class="sub" x="492" y="272">layout · keybinds · routing</text>
  <text class="sub" x="492" y="282">3-pane + status bar</text>

  <!-- ═══ Right panel: Workspace Convention ═══ -->
  <rect class="card" x="800" y="78" width="370" height="278" rx="12"/>
  <text class="sec" x="820" y="100">WORKSPACE CONVENTION</text>

  <rect x="820" y="110" width="330" height="56" rx="6" fill="#1C2333" stroke="#FFA657" stroke-width="1" opacity="0.8"/>
  <text class="label-orange" x="836" y="126">AGENT DIRECTORY</text>
  <text class="sub mono" x="836" y="142">state.json</text>
  <text class="sub" x="920" y="142">status, task, step, model</text>
  <text class="sub mono" x="836" y="156">agent.json</text>
  <text class="sub" x="920" y="156">alternate state file</text>

  <line x1="985" y1="170" x2="985" y2="180" stroke="#30363D" stroke-width="1"/>
  <polygon points="981,180 989,180 985,186" fill="#30363D"/>

  <rect x="820" y="190" width="330" height="56" rx="6" fill="#1C2333" stroke="#34D399" stroke-width="1" opacity="0.8"/>
  <text class="label" x="836" y="206">SUBDIRECTORIES</text>
  <text class="sub mono" x="836" y="222">memory/</text>
  <text class="sub" x="906" y="222">agent context and facts</text>
  <text class="sub mono" x="836" y="236">logs/</text>
  <text class="sub" x="906" y="236">run.log with level coloring</text>

  <line x1="985" y1="250" x2="985" y2="260" stroke="#30363D" stroke-width="1"/>
  <polygon points="981,260 989,260 985,266" fill="#30363D"/>

  <rect x="820" y="270" width="330" height="56" rx="6" fill="#1C2333" stroke="#D2A8FF" stroke-width="1" opacity="0.8"/>
  <text class="label-purple" x="836" y="286">RUN HISTORY</text>
  <text class="sub mono" x="836" y="302">runs/run-001/</text>
  <text class="sub" x="940" y="302">numbered runs</text>
  <text class="sub mono" x="836" y="316">runs/20260408_130000/</text>
  <text class="sub" x="990" y="316">timestamped</text>

  <circle class="dot" cx="812" cy="138" r="3" opacity="0.6"/>
  <circle class="dot" cx="812" cy="222" r="3" opacity="0.6"/>
  <circle class="dot" cx="812" cy="298" r="3" opacity="0.6"/>

  <!-- ═══ Bottom: TUI Layout ═══ -->
  <text class="sec" x="40" y="378">TUI LAYOUT</text>

  <!-- Status bar -->
  <rect x="40" y="388" width="740" height="28" rx="6" fill="#1C2333" stroke="#34D399" stroke-width="1" opacity="0.8"/>
  <text class="label" x="56" y="402">AGENT STATUS BAR</text>
  <text class="sub" x="56" y="412">agent-alpha</text>
  <circle cx="122" cy="409" r="3" fill="#34D399"/>
  <text class="sub" x="130" y="412">running</text>
  <text class="sub" x="188" y="412">│</text>
  <text class="sub" x="200" y="412">agent-beta</text>
  <circle cx="260" cy="409" r="3" fill="#8B949E"/>
  <text class="sub" x="268" y="412">idle</text>
  <text class="sub" x="300" y="412">│</text>
  <text class="sub" x="312" y="412">agent-gamma</text>
  <text class="sub" x="382" y="412" fill="#F85149">✕ error</text>

  <!-- Tree pane -->
  <rect x="40" y="424" width="220" height="120" rx="6" fill="#1C2333" stroke="#58A6FF" stroke-width="1.5" opacity="0.8"/>
  <text class="label-blue" x="56" y="442">FILES</text>
  <text class="sub mono" x="56" y="458">▼ agent-alpha/</text>
  <text class="sub mono" x="72" y="472">  state.json</text>
  <text class="sub mono" x="72" y="486">  ▶ logs/</text>
  <text class="sub mono" x="72" y="500">  ▶ memory/</text>
  <text class="sub mono" x="72" y="514">  ▶ runs/</text>
  <text class="sub mono" x="56" y="528">▶ agent-beta/</text>

  <!-- Viewer pane -->
  <rect x="270" y="424" width="510" height="68" rx="6" fill="#1C2333" stroke="#30363D" stroke-width="1" opacity="0.8"/>
  <text class="label-blue" x="286" y="442">PREVIEW</text>
  <text class="sub mono" x="286" y="458"><tspan fill="#8B949E">1</tspan>  <tspan fill="#30363D">{</tspan></text>
  <text class="sub mono" x="286" y="472"><tspan fill="#8B949E">2</tspan>    <tspan fill="#58A6FF">"status"</tspan>: <tspan fill="#34D399">"running"</tspan>,</text>
  <text class="sub mono" x="286" y="486"><tspan fill="#8B949E">3</tspan>    <tspan fill="#58A6FF">"task"</tspan>: <tspan fill="#34D399">"research"</tspan></text>

  <!-- Activity pane -->
  <rect x="270" y="500" width="510" height="44" rx="6" fill="#1C2333" stroke="#30363D" stroke-width="1" opacity="0.8"/>
  <text class="label-blue" x="286" y="518">ACTIVITY</text>
  <text class="sub mono" x="286" y="532"><tspan fill="#8B949E">13:04:05</tspan> <tspan fill="#E3B341">~~~</tspan> agent-alpha/state.json</text>

  <!-- Bottom: keybindings -->
  <rect class="card" x="800" y="388" width="370" height="156" rx="12"/>
  <text class="sec" x="820" y="410">KEYBINDINGS</text>
  <text class="sub mono" x="820" y="428">j/k</text><text class="sub" x="870" y="428">navigate</text>
  <text class="sub mono" x="820" y="442">enter</text><text class="sub" x="870" y="442">open file / expand dir</text>
  <text class="sub mono" x="820" y="456">/</text><text class="sub" x="870" y="456">search in viewer</text>
  <text class="sub mono" x="820" y="470">n / N</text><text class="sub" x="870" y="470">next / prev match</text>
  <text class="sub mono" x="820" y="484">tab</text><text class="sub" x="870" y="484">cycle panes</text>
  <text class="sub mono" x="820" y="498">R</text><text class="sub" x="870" y="498">toggle run history</text>
  <text class="sub mono" x="820" y="512">g / G</text><text class="sub" x="870" y="512">top / bottom</text>
  <text class="sub mono" x="820" y="526">r</text><text class="sub" x="870" y="526">reload</text>

  <!-- Footer -->
  <text class="dim" x="40" y="564">go install github.com/stxkxs/agentfs@latest</text>
  <text class="cmd" x="340" y="564">Go · Bubble Tea · Lip Gloss · fsnotify</text>
</svg>
